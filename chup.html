<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agendamento</title>

<style>
  body {
    font-family: Arial;
    background: #f5f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 350px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
    margin-bottom: 15px;
  }

  /* WRAPPER COM SETAS */
  .dias-wrapper {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .seta {
    background: #ecf0f1;
    border: none;
    padding: 8px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
  }

  .seta:hover {
    background: #dcdde1;
  }

  /* DIAS */
  .dias {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 10px 0;
    scroll-behavior: smooth;

    scrollbar-width: none;
  }

  .dias::-webkit-scrollbar {
    display: none;
  }

  .dia {
    min-width: 65px;
    padding: 12px;
    border-radius: 12px;
    background: #ecf0f1;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
  }

  .dia:hover {
    background: #0984e3;
    color: white;
  }

  .dia.selecionado {
    background: #0984e3;
    color: white;
  }

  .dia small {
    display: block;
    font-size: 12px;
  }

  /* HORÁRIOS */
  .horarios {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .horario {
    padding: 14px;
    background: #00b894;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    font-weight: bold;
    transition: 0.2s;
  }

  .horario:hover {
    background: #019875;
  }

</style>
</head>
<body>

<div class="container">
  <h2>Agendar horário</h2>

  <div class="dias-wrapper">
    <button class="seta" onclick="scrollDias(-120)">◀</button>
    
    <div class="dias" id="dias"></div>
    
    <button class="seta" onclick="scrollDias(120)">▶</button>
  </div>

  <div class="horarios" id="horarios"></div>
</div>

<script>
  const diasDiv = document.getElementById("dias");
  const horariosDiv = document.getElementById("horarios");

  const horarios = ["09:00", "10:00", "11:00", "14:00", "15:00", "16:00"];
  const nomesDias = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

  const hoje = new Date();

  function gerarProximosDias(qtd = 10) {
    diasDiv.innerHTML = "";

    for (let i = 0; i < qtd; i++) {
      const data = new Date();
      data.setDate(hoje.getDate() + i);

      const diaSemana = data.getDay();
      if (diaSemana === 0) continue;

      const div = document.createElement("div");
      div.classList.add("dia");

      div.innerHTML = `
        <small>${nomesDias[diaSemana]}</small>
        <strong>${data.getDate()}</strong>
      `;

      div.onclick = () => selecionarDia(div, data);

      diasDiv.appendChild(div);
    }
  }

  function selecionarDia(elemento, data) {
    document.querySelectorAll(".dia").forEach(d => d.classList.remove("selecionado"));
    elemento.classList.add("selecionado");

    horariosDiv.innerHTML = "<h3>Horários disponíveis:</h3>";

    horarios.forEach(h => {
      const btn = document.createElement("div");
      btn.classList.add("horario");
      btn.innerText = h;

      btn.onclick = () => {
        alert(`Agendado para ${data.toLocaleDateString()} às ${h}`);
      };

      horariosDiv.appendChild(btn);
    });
  }

  function scrollDias(valor) {
    diasDiv.scrollLeft += valor;
  }

  // SCROLL COM MOUSE (IMPORTANTE PRO PC)
  diasDiv.addEventListener("wheel", (e) => {
    e.preventDefault();
    diasDiv.scrollLeft += e.deltaY;
  });

  gerarProximosDias();
</script>

</body>
</html>
